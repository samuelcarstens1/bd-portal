<meta charset="utf-8">
<title>BusDev Map — Night Jobsite</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: toolbar, breadcrumb, a "focus and drill" stage (focused circle in the
   center, its children in a ring, the parent parked top-left), a detail drawer
   (right rail on desktop, bottom sheet on phones) and a quiet sources footer.
   Everything is scoped under .pw-map so the page can live inside another site. */
:root {
  --pw-bg: #f3f5f8;
  --pw-surface: #ffffff;
  --pw-surface-2: #e9edf2;
  --pw-fg: #1a222e;
  --pw-fg-muted: #5b6878;
  --pw-line: #cfd6df;
  --pw-accent: #2a5d9f;
  --pw-accent-soft: #dbe6f5;
  --pw-edge: #9aa6b5;
  --pw-shadow: 0 10px 30px rgba(26, 34, 46, 0.14);
  --pw-c-company: #16304f;
  --pw-c-branch: #2a5d9f;
  --pw-c-person: #c47a12;
  --pw-c-gc: #1d8a6b;
  --pw-c-project: #6b4fa8;
  --pw-c-signal: #cf4a2e;
  --pw-c-warm: #b92d6c;
  --pw-c-comp: #8a5a2b;
  --pw-c-ours: #0b7a94;
  --pw-client: #9a6400;
  --pw-client-soft: #fbf0d9;
  --pw-font-display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --pw-font-body: "Source Sans 3", "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pw-bg: #121820;
    --pw-surface: #1a222c;
    --pw-surface-2: #232d39;
    --pw-fg: #e6ebf1;
    --pw-fg-muted: #9aa7b6;
    --pw-line: #2f3b49;
    --pw-accent: #7fb0ea;
    --pw-accent-soft: #223650;
    --pw-edge: #4a5868;
    --pw-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    --pw-c-company: #9fc3f0;
    --pw-c-branch: #6ea2e4;
    --pw-c-person: #e4a63c;
    --pw-c-gc: #3fc199;
    --pw-c-project: #a68be6;
    --pw-c-signal: #f0704f;
    --pw-c-warm: #ec5f9c;
    --pw-c-comp: #d39a5f;
    --pw-c-ours: #4cc9e0;
    --pw-client: #f0bd55;
    --pw-client-soft: #3a2e14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --pw-bg: #121820;
  --pw-surface: #1a222c;
  --pw-surface-2: #232d39;
  --pw-fg: #e6ebf1;
  --pw-fg-muted: #9aa7b6;
  --pw-line: #2f3b49;
  --pw-accent: #7fb0ea;
  --pw-accent-soft: #223650;
  --pw-edge: #4a5868;
  --pw-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  --pw-c-company: #9fc3f0;
  --pw-c-branch: #6ea2e4;
  --pw-c-person: #e4a63c;
  --pw-c-gc: #3fc199;
  --pw-c-project: #a68be6;
  --pw-c-signal: #f0704f;
  --pw-c-warm: #ec5f9c;
  --pw-c-comp: #d39a5f;
  --pw-c-ours: #4cc9e0;
  --pw-client: #f0bd55;
  --pw-client-soft: #3a2e14;
  color-scheme: dark;
}

body { margin: 0; background: var(--pw-bg); color: var(--pw-fg); }

.pw-map, .pw-map * { box-sizing: border-box; }
.pw-map [hidden] { display: none !important; }
.pw-map {
  background: var(--pw-bg);
  color: var(--pw-fg);
  font-family: var(--pw-font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
  overflow-x: hidden;
}
.pw-map a { color: var(--pw-accent); }
.pw-map button, .pw-map input { font: inherit; color: inherit; }
.pw-map button { cursor: pointer; }
.pw-map :focus-visible { outline: 2px solid var(--pw-accent); outline-offset: 2px; }

.pw-map .app { max-width: 1400px; margin: 0 auto; display: grid; gap: 12px; }

.pw-map .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.pw-map .head h1 {
  font-family: var(--pw-font-display); font-weight: 700;
  font-size: clamp(22px, 3vw, 30px); letter-spacing: 0.01em; margin: 0; text-wrap: balance;
}
.pw-map .head .sub { color: var(--pw-fg-muted); font-size: 14px; }

/* Toolbar */
.pw-map .toolbar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  background: var(--pw-surface); border: 1px solid var(--pw-line); border-radius: 10px; padding: 8px 10px;
}
.pw-map .search { position: relative; flex: 1 1 220px; min-width: 0; }
.pw-map .search input {
  width: 100%; padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--pw-line); background: var(--pw-bg); color: var(--pw-fg);
}
.pw-map .search input::placeholder { color: var(--pw-fg-muted); }
.pw-map .results {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 25; max-height: 280px; overflow: auto;
  background: var(--pw-surface); border: 1px solid var(--pw-line); border-radius: 8px; box-shadow: var(--pw-shadow);
  margin: 0; padding: 4px; list-style: none;
}
.pw-map .results li button {
  width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px;
  display: flex; align-items: center; gap: 8px; min-width: 0;
}
.pw-map .results li button:hover, .pw-map .results li button.active { background: var(--pw-surface-2); }
.pw-map .results .dot { flex: 0 0 9px; width: 9px; height: 9px; border-radius: 50%; }
.pw-map .results .path { color: var(--pw-fg-muted); font-size: 12px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%; }
.pw-map .results .empty { padding: 6px 8px; color: var(--pw-fg-muted); font-size: 13px; }
.pw-map .btn {
  border: 1px solid var(--pw-line); background: var(--pw-surface); border-radius: 8px;
  padding: 7px 12px; font-weight: 600; font-size: 14px; white-space: nowrap;
}
.pw-map .btn:hover { background: var(--pw-surface-2); }
.pw-map .btn:disabled { opacity: 0.45; cursor: default; }
.pw-map .toolbar .grp { display: flex; gap: 6px; flex-wrap: wrap; }

/* Breadcrumb */
/* Path trail: one small circle per level you've drilled through, joined by a line. */
.pw-map .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--pw-surface); border: 1px solid var(--pw-line); border-radius: 10px; padding: 8px 10px; }
.pw-map .crumbs .trail { display: flex; align-items: flex-start; overflow-x: auto; min-width: 0; flex: 1 1 auto; scrollbar-width: thin; padding-bottom: 2px; }
.pw-map .crumbs .step { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 3px; width: 92px; border: 0; background: transparent; padding: 2px 2px 3px; border-radius: 8px; cursor: pointer; color: var(--pw-accent); font: 600 12px/1.2 var(--pw-font-body); }
.pw-map .crumbs .step:hover { background: var(--pw-accent-soft); }
.pw-map .crumbs .step .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); margin: 2px 0; }
.pw-map .crumbs .step[aria-current="page"] { color: var(--pw-fg); cursor: default; background: transparent; }
.pw-map .crumbs .step[aria-current="page"] .dot { width: 18px; height: 18px; margin: 0; box-shadow: 0 0 0 3px var(--pw-surface), 0 0 0 5px var(--c); }
.pw-map .crumbs .lbl { text-align: center; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 100%; }
.pw-map .crumbs .typ { font-weight: 400; font-size: 11px; color: var(--pw-fg-muted); }
.pw-map .crumbs .link { flex: 0 0 22px; height: 2px; background: var(--pw-line); margin-top: 12px; }
.pw-map .crumbs .return { flex: 0 0 auto; border: 1px solid var(--pw-c-comp); color: var(--pw-c-comp); background: transparent; border-radius: 999px; padding: 5px 12px; font: 600 13px var(--pw-font-body); cursor: pointer; }
.pw-map .crumbs .return:hover { background: var(--pw-accent-soft); }
.pw-map .crumbs button:focus-visible { outline: 2px solid var(--pw-accent); outline-offset: 2px; }
@media (max-width: 560px) { .pw-map .crumbs .step { width: 72px; } .pw-map .crumbs .link { flex-basis: 12px; } }

/* Legend */
.pw-map .legend { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; }
.pw-map .legend .hint { color: var(--pw-fg-muted); margin-right: 4px; }
.pw-map .chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 7px;
  border-radius: 999px; border: 1px solid var(--pw-line); background: var(--pw-surface); font-size: 13px; font-weight: 600;
}
.pw-map .chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--chip); }
.pw-map .chip .n { color: var(--pw-fg-muted); font-weight: 400; }

/* Stage + panel */
.pw-map .main { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.pw-map .main.has-panel { grid-template-columns: minmax(0, 1fr) 360px; }
.pw-map .stage {
  position: relative; min-width: 0; height: clamp(440px, 70vh, 820px);
  background: var(--pw-surface); border: 1px solid var(--pw-line); border-radius: 12px; overflow: hidden;
}
.pw-map .stage svg { width: 100%; height: 100%; display: block; }
.pw-map .stage .help {
  position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--pw-fg-muted);
  background: color-mix(in srgb, var(--pw-surface) 85%, transparent); padding: 4px 8px; border-radius: 6px; pointer-events: none;
}

/* SVG */
.pw-map .edge { fill: none; stroke: var(--pw-edge); stroke-width: 1.5px; }
.pw-map .node { cursor: pointer; }
.pw-map .node circle { stroke: var(--pw-surface); stroke-width: 3px; transition: filter 0.2s; }
.pw-map .node:hover circle { filter: brightness(1.12); }
.pw-map .node.parent circle { opacity: 0.45; }
.pw-map .node.parent text { fill: var(--pw-fg-muted); }
.pw-map .node.focus { cursor: default; }
.pw-map .node.focus.leaf-open { cursor: pointer; }
.pw-map .node text {
  font-family: var(--pw-font-body); font-size: 13px; fill: var(--pw-fg);
  paint-order: stroke; stroke: var(--pw-surface); stroke-width: 3.5px; stroke-linejoin: round;
}
.pw-map .node.ring text.label { font-weight: 600; }
.pw-map .node.focus text.label { font-family: var(--pw-font-display); font-weight: 700; font-size: 20px; }
.pw-map .node.focus.dense text.label { fill: var(--pw-surface); stroke: none; }
.pw-map .node text.badge { font-size: 11.5px; fill: var(--pw-fg-muted); font-weight: 400; }
.pw-map .node text.hint { font-size: 12px; fill: var(--pw-fg-muted); font-style: italic; }
.pw-map .node text.ord { font-family: var(--pw-font-display); font-weight: 700; fill: var(--pw-surface); font-size: 15px; stroke: none; pointer-events: none; }
.pw-map .node.ring.open-mark circle.mark { fill: var(--pw-surface); stroke: none; }
.pw-map .node text.mark { fill: var(--pw-surface); stroke: none; font-size: 11px; font-weight: 700; pointer-events: none; }

/* Tooltip */
.pw-map .tip {
  position: fixed; z-index: 20; pointer-events: none; max-width: 260px;
  background: var(--pw-fg); color: var(--pw-bg); padding: 7px 10px; border-radius: 7px;
  font-size: 12.5px; line-height: 1.35; box-shadow: var(--pw-shadow);
}
.pw-map .tip b { display: block; font-family: var(--pw-font-display); font-size: 14px; }
.pw-map .tip .t { opacity: 0.8; }

/* Detail panel */
.pw-map .panel {
  background: var(--pw-surface); border: 1px solid var(--pw-line); border-radius: 12px;
  display: flex; flex-direction: column; min-width: 0; max-height: clamp(440px, 70vh, 820px);
}
.pw-map .panel header { display: flex; align-items: flex-start; gap: 10px; padding: 14px 14px 10px; border-bottom: 1px solid var(--pw-line); }
.pw-map .panel header .type {
  display: inline-block; font-size: 12px; font-weight: 600; color: var(--pw-surface);
  background: var(--ptype); padding: 2px 8px; border-radius: 999px; margin-bottom: 6px;
}
.pw-map .panel header h2 { font-family: var(--pw-font-display); font-size: 20px; margin: 0; line-height: 1.2; text-wrap: balance; }
.pw-map .panel header .close { margin-left: auto; border: 0; background: transparent; font-size: 22px; line-height: 1; padding: 2px 6px; color: var(--pw-fg-muted); }
.pw-map .panel header .close:hover { color: var(--pw-fg); }
.pw-map .panel .body { padding: 10px 14px 14px; overflow: auto; }
.pw-map .panel dl { margin: 0; display: grid; grid-template-columns: 1fr; gap: 8px; }
.pw-map .panel dt { font-size: 12px; color: var(--pw-fg-muted); letter-spacing: 0.02em; }
.pw-map .panel dd { margin: 0 0 4px; overflow-wrap: anywhere; }
.pw-map .panel dd ul { margin: 2px 0 0; padding-left: 18px; }
.pw-map .panel dd li { margin: 2px 0; }
.pw-map .panel .links a { display: inline-block; margin: 4px 8px 0 0; }
.pw-map .panel .li { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--pw-line); }
.pw-map .panel .li h3 { font: 700 13px var(--pw-font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--pw-fg-muted); margin: 0 0 8px; }
.pw-map .panel .li-open { display: inline-block; margin-bottom: 8px; font-weight: 600; }
.pw-map .panel .li-row { display: flex; gap: 6px; flex-wrap: wrap; }
.pw-map .panel .li-row input { flex: 1 1 180px; min-width: 0; padding: 6px 8px; border: 1px solid var(--pw-line); border-radius: 6px; background: var(--pw-bg); color: var(--pw-fg); font: 13px var(--pw-font-body); }
.pw-map .panel .li-row .btn.primary { background: var(--pw-accent); color: var(--pw-surface); border-color: var(--pw-accent); }
.pw-map .panel .li-msg { font-size: 12px; color: var(--pw-fg-muted); margin-top: 4px; }
.pw-map .panel .email { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--pw-line); }
.pw-map .panel .email h3 { font: 700 13px var(--pw-font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--pw-fg-muted); margin: 0 0 8px; }
.pw-map .panel .em-l { display: block; font-size: 12px; color: var(--pw-fg-muted); margin: 6px 0 2px; }
.pw-map .panel .em-l input, .pw-map .panel .em-l select, .pw-map .panel textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 2px; padding: 6px 8px; border: 1px solid var(--pw-line); border-radius: 6px; background: var(--pw-bg); color: var(--pw-fg); font: 13px/1.45 var(--pw-font-body); }
.pw-map .panel textarea { margin-top: 8px; resize: vertical; }
.pw-map .panel .em-btns { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.pw-map .panel .em-btns .btn.primary { background: var(--pw-accent); color: var(--pw-surface); border-color: var(--pw-accent); text-decoration: none; }
.pw-map .panel .em-hint { font-size: 12px; color: var(--pw-fg-muted); }
.pw-map .panel .rel { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--pw-line); }
.pw-map .panel .rel h3 { font-size: 13px; color: var(--pw-fg-muted); margin: 0 0 4px; font-weight: 600; }
.pw-map .panel .rel button {
  border: 1px solid var(--pw-line); background: var(--pw-bg); border-radius: 6px; padding: 3px 8px;
  margin: 3px 4px 0 0; font-size: 13px;
}
.pw-map .panel .rel button:hover { border-color: var(--pw-accent); }
.pw-map .panel .rel button i { font-style: normal; color: var(--pw-fg-muted); margin-right: 4px; }

.pw-map .panel .client-box { background: var(--pw-client-soft); border: 1px solid var(--pw-client); border-radius: 10px; padding: 9px 11px; margin: 0 0 12px; }
.pw-map .panel .client-box b { display: block; color: var(--pw-client); font: 700 15px var(--pw-font-display); letter-spacing: .02em; }
.pw-map .panel .client-box span { display: block; font-size: 13px; margin-top: 2px; }
.pw-map .panel header h2 .star { color: var(--pw-client); margin-right: 4px; }
.pw-map .panel .out { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--pw-line); }
.pw-map .panel .out h3 { font: 700 13px var(--pw-font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--pw-fg-muted); margin: 0 0 6px; }
.pw-map .panel .out-sum { font-size: 13px; margin: 0 0 8px; }
.pw-map .panel .out-sum .due { color: var(--pw-c-signal); font-weight: 600; }
.pw-map .panel .out-form { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pw-map .panel .out-form label { font-size: 12px; color: var(--pw-fg-muted); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pw-map .panel .out-form .wide { grid-column: 1 / -1; }
.pw-map .panel .out-form input, .pw-map .panel .out-form select { padding: 6px 8px; border: 1px solid var(--pw-line); border-radius: 6px; background: var(--pw-bg); color: var(--pw-fg); font: 13px var(--pw-font-body); min-width: 0; }
.pw-map .panel .out-form .btn.primary { background: var(--pw-accent); color: var(--pw-surface); border-color: var(--pw-accent); justify-self: start; }
.pw-map .panel .out-log { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.pw-map .panel .out-log li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 13px; padding: 6px 8px; border: 1px solid var(--pw-line); border-radius: 6px; background: var(--pw-bg); }
.pw-map .panel .out-log li .m { color: var(--pw-fg-muted); font-size: 12px; grid-column: 1; }
.pw-map .panel .out-log li button { grid-row: 1 / span 2; grid-column: 2; border: 0; background: transparent; color: var(--pw-fg-muted); font-size: 16px; cursor: pointer; }
.pw-map .panel .out-form textarea { padding: 6px 8px; border: 1px solid var(--pw-line); border-radius: 6px; background: var(--pw-bg); color: var(--pw-fg); font: 13px/1.45 var(--pw-font-body); resize: vertical; margin: 0; }
.pw-map .panel .out-msg { font-size: 12px; color: var(--pw-fg-muted); margin-top: 4px; }

.pw-map .btn.fu-btn { border-color: var(--pw-client); color: var(--pw-client); font-weight: 600; }
.pw-map .btn.fu-btn[aria-expanded="true"] { background: var(--pw-client-soft); }
.pw-map .fu { background: var(--pw-surface); border: 1px solid var(--pw-client); border-radius: 12px; }
.pw-map .fu header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--pw-line); }
.pw-map .fu header h2 { font: 700 18px var(--pw-font-display); margin: 0; margin-right: auto; }
.pw-map .fu header .close { border: 0; background: transparent; font-size: 22px; line-height: 1; padding: 2px 6px; color: var(--pw-fg-muted); cursor: pointer; }
.pw-map .fu-body { padding: 8px 14px 14px; max-height: 46vh; overflow: auto; }
.pw-map .fu-sub, .pw-map .fu-empty { color: var(--pw-fg-muted); font-size: 13px; margin: 4px 0 6px; }
.pw-map .fu h3 { font: 700 13px var(--pw-font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--pw-fg-muted); margin: 12px 0 6px; }
.pw-map .fu h3 span { color: var(--pw-fg); }
.pw-map .fu ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pw-map .fu li { display: grid; gap: 2px; padding: 8px 10px; border: 1px solid var(--pw-line); border-radius: 8px; background: var(--pw-bg); }
.pw-map .fu .fu-go { all: unset; cursor: pointer; font-size: 14px; color: var(--pw-accent); }
.pw-map .fu .fu-go:hover b { text-decoration: underline; }
.pw-map .fu .fu-go:focus-visible { outline: 2px solid var(--pw-accent); outline-offset: 2px; }
.pw-map .fu .fu-go .t { color: var(--pw-fg-muted); font-size: 12.5px; margin-left: 6px; }
.pw-map .fu .fu-go .star { color: var(--pw-client); margin-right: 4px; }
.pw-map .fu .fu-meta { font-size: 12.5px; color: var(--pw-fg-muted); }
.pw-map .fu .fu-note { font-size: 13px; }
.pw-map .btn.pr-btn[aria-expanded="true"] { background: var(--pw-accent-soft, rgba(0,0,0,.06)); }
.pw-map .fu.pr { border-color: var(--pw-line); }
.pw-map .pr-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.pw-map .pr-chips button { font: inherit; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--pw-line); background: var(--pw-bg); color: var(--pw-fg); cursor: pointer; }
.pw-map .pr-chips button[aria-pressed="true"] { border-color: var(--pw-accent); color: var(--pw-accent); font-weight: 600; }
.pw-map .pr .tag { font-size: 11.5px; border: 1px solid var(--pw-line); border-radius: 999px; padding: 0 7px; margin-left: 6px; color: var(--pw-fg-muted); }
.pw-map .pr .cold { color: var(--pw-fg-muted); }

/* Footer */
.pw-map .foot { font-size: 13px; color: var(--pw-fg-muted); }
.pw-map .foot details { border: 1px solid var(--pw-line); border-radius: 10px; background: var(--pw-surface); padding: 8px 12px; }
.pw-map .foot summary { cursor: pointer; font-weight: 600; color: var(--pw-fg); }

<style>/* Night jobsite theme: navy blueprint, safety-orange connectors, three node sizes. */
:root{
  --nj-bg:#0A1424; --nj-node:#13253D; --nj-border:#4A6690; --nj-orange:#F27A1A; --nj-fg:#FFFFFF; --nj-muted:#A9BCD6; --nj-line:#22395A;
  --nj-cond:"Roboto Condensed","Arial Narrow",Arial,sans-serif; --nj-sans:"Roboto",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;background:var(--nj-bg);color:var(--nj-fg)}
body{font:14px/1.45 var(--nj-sans);
  background-image:linear-gradient(rgba(74,102,144,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(74,102,144,.10) 1px,transparent 1px);
  background-size:40px 40px;background-attachment:fixed}
.pw-map{
  --pw-bg:#0D1A2E; --pw-surface:#13253D; --pw-surface-2:#1A3150; --pw-fg:#FFFFFF; --pw-fg-muted:#A9BCD6; --pw-line:#2A4466;
  --pw-accent:#F27A1A; --pw-accent-soft:rgba(242,122,26,.16); --pw-edge:#4A6690; --pw-shadow:0 12px 32px rgba(0,0,0,.5);
  --pw-c-company:#4A6690; --pw-c-branch:#4A6690; --pw-c-person:#4A6690; --pw-c-gc:#4A6690; --pw-c-project:#4A6690; --pw-c-signal:#4A6690;
  --pw-c-warm:#4A6690; --pw-c-comp:#4A6690; --pw-c-ours:#4A6690; --pw-client:#F27A1A; --pw-client-soft:rgba(242,122,26,.12);
  --pw-font-display:var(--nj-cond); --pw-font-body:var(--nj-sans);
  background:transparent!important;padding:0!important;font:14px/1.45 var(--nj-sans)!important;overflow:visible!important;
}
.nj{display:grid;grid-template-columns:minmax(320px,410px) minmax(0,1fr);min-height:100vh}
.nj-side{display:flex;flex-direction:column;gap:14px;padding:28px 22px 28px max(22px,env(safe-area-inset-left,0px));max-height:100vh;overflow:auto;box-sizing:border-box;border-right:1px solid var(--nj-line);background:rgba(10,20,36,.82)}
.nj-title h1{font:700 30px/1.05 var(--nj-cond);margin:0;letter-spacing:.01em;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nj-title p{margin:6px 0 0;color:var(--nj-muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nj-title .eyebrow{font:700 11px var(--nj-cond);letter-spacing:.18em;color:var(--nj-orange);text-transform:uppercase;display:block;margin-bottom:6px}
.pw-map .toolbar,.pw-map .crumbs,.pw-map .foot details,.pw-map .fu,.pw-map .panel{background:var(--nj-node)!important;border:1px solid var(--nj-line)!important;border-radius:10px!important}
.pw-map .toolbar{padding:10px!important}
.pw-map .btn{min-height:38px;border-radius:6px;background:transparent;border:1px solid var(--nj-border);color:#fff;font:700 13px var(--nj-cond);letter-spacing:.06em;text-transform:uppercase;padding:0 12px}
.pw-map .btn:hover{border-color:var(--nj-orange);background:rgba(242,122,26,.08)}
.pw-map .btn.fu-btn,.pw-map .btn.pr-btn{border-color:var(--nj-orange);color:var(--nj-orange)}
.pw-map .btn.primary,.pw-map .panel .btn.primary{background:var(--nj-orange)!important;border-color:var(--nj-orange)!important;color:#0A1424!important}
.pw-map .search input{background:#0D1A2E;border:1px solid var(--nj-border);color:#fff;min-height:38px;border-radius:6px}
.pw-map .crumbs .step{color:var(--nj-muted);font-family:var(--nj-cond)}
.pw-map .crumbs .step .dot{background:var(--nj-border)}
.pw-map .crumbs .step[aria-current="page"]{color:#fff}
.pw-map .crumbs .step[aria-current="page"] .dot{background:var(--nj-orange);box-shadow:0 0 0 3px var(--nj-node),0 0 0 5px var(--nj-orange)}
.pw-map .crumbs .return{border-color:var(--nj-orange);color:var(--nj-orange)}
.pw-map .panel{display:flex;flex-direction:column;max-height:none!important;position:static!important}
.pw-map .panel header .type{background:transparent!important;color:var(--nj-orange)!important;border:1px solid var(--nj-orange);font-family:var(--nj-cond);letter-spacing:.08em;text-transform:uppercase}
.pw-map .panel header h2{font:700 22px/1.1 var(--nj-cond)!important;text-transform:uppercase;letter-spacing:.01em}
.pw-map .panel .body{overflow:visible!important}
.pw-map a{color:var(--nj-orange)}
.pw-map .panel .out-form input,.pw-map .panel .out-form select,.pw-map .panel textarea,.pw-map .panel .li-row input,.pw-map .panel .em-l input,.pw-map .panel .em-l select{background:#0D1A2E!important;border-color:var(--nj-border)!important;color:#fff!important}
.nj-center{margin:0 14px 12px;align-self:flex-start}
.pw-map .fu header h2{font-family:var(--nj-cond)!important;text-transform:uppercase}
.pw-map .foot{color:var(--nj-muted)}
/* diagram */
.nj-stagewrap{position:relative;min-width:0}
.pw-map .stage{position:sticky;top:0;height:100vh;min-height:640px;background:transparent!important;border:0!important;border-radius:0!important;overflow:hidden}
#pwSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#pwNodes{position:absolute;inset:0}
.ln{stroke:var(--nj-orange);stroke-linecap:round}
.ln.main{stroke-width:3}.ln.sub{stroke-width:2}.ln.cat{stroke-width:1.5}
.ln-dot{fill:var(--nj-orange)}
.hn{position:absolute;left:0;top:0;width:var(--d);height:var(--d);border-radius:50%;padding:0;margin:0;cursor:pointer;color:#fff;font:inherit;
  transition:transform .45s cubic-bezier(.2,.7,.2,1),opacity .3s,box-shadow .2s;box-sizing:border-box}
@media (prefers-reduced-motion:reduce){.hn{transition:none}}
.hn:focus-visible{outline:3px solid var(--nj-orange);outline-offset:4px}
.hn.hub{border:12px solid var(--nj-orange);background:radial-gradient(circle at 50% 32%,#24476F 0,#13253D 55%,#0C1A2D 100%);overflow:hidden;
  box-shadow:0 0 0 8px rgba(242,122,26,.12),0 18px 50px rgba(0,0,0,.55)}
.hn.hub .mono{position:absolute;left:0;right:0;top:20%;text-align:center;font:700 calc(var(--d) * .3)/1 var(--nj-cond);color:#5E7FAD;letter-spacing:.02em}
.hn.hub .band{position:absolute;left:0;right:0;bottom:0;height:40%;background:rgba(4,10,20,.9);display:flex;flex-direction:column;align-items:center;padding:9px 14% 0;box-sizing:border-box;text-align:center}
.hn.hub .band b{font:700 15px/1.1 var(--nj-cond);text-transform:uppercase;letter-spacing:.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hn.hub .band i{font:normal 11px/1.3 var(--nj-sans);color:var(--nj-muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.hn.branch{background:var(--nj-node);border:2px solid var(--nj-border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 calc(var(--d) * .15);text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.45)}
.hn.branch:hover{border-color:var(--nj-orange)}
.hn.branch .ty{font:700 10px var(--nj-cond);letter-spacing:.16em;text-transform:uppercase;color:var(--nj-orange)}
.hn.branch b{font:700 calc(min(18px, var(--d) * .1))/1.08 var(--nj-cond);text-transform:uppercase;letter-spacing:.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hn.branch .dt{font:11px/1.3 var(--nj-sans);color:var(--nj-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hn.sat,.hn.more{background:var(--nj-node);border:2px solid var(--nj-orange);display:flex;align-items:center;justify-content:center}
.hn.sat .ini,.hn.more .ini{font:700 17px var(--nj-cond);letter-spacing:.02em}
.hn.more{border-style:dashed}
.hn .nm{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);white-space:nowrap;font:700 12px var(--nj-cond);letter-spacing:.02em;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
.hn.sat:hover{background:#1C3556}
.hn.sel{box-shadow:0 0 0 4px var(--nj-bg),0 0 0 7px var(--nj-orange),0 0 24px rgba(242,122,26,.45)}
.hn.hub.sel{box-shadow:0 0 0 8px rgba(242,122,26,.25),0 18px 50px rgba(0,0,0,.55)}
.cat{position:absolute;max-width:130px;font:700 12px var(--nj-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--nj-orange);white-space:nowrap;pointer-events:none;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.cat{transform:translate(-50%,-100%);text-align:center}
#pwUp,#pwPager{position:absolute;z-index:5}
#pwUp{left:20px;top:18px;background:rgba(19,37,61,.9);border:1px solid var(--nj-border);color:#fff;border-radius:999px;padding:8px 14px;font:700 12px var(--nj-cond);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pwUp:hover{border-color:var(--nj-orange)}
#pwPager{left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(19,37,61,.92);border:1px solid var(--nj-border);border-radius:999px;padding:4px 6px;font:700 12px var(--nj-cond);letter-spacing:.06em}
#pwPager button{width:32px;height:32px;border-radius:50%;border:1px solid var(--nj-orange);background:transparent;color:var(--nj-orange);font-size:18px;cursor:pointer}
#pwPager button:disabled{opacity:.3;cursor:default}
.pw-map .stage .help{left:auto;right:18px;bottom:18px;background:rgba(19,37,61,.85);color:var(--nj-muted)}
.pw-map .tip{background:#fff;color:#0A1424}
.nj-draft{font:700 10px var(--nj-cond);letter-spacing:.16em;color:#0A1424;background:var(--nj-orange);border-radius:3px;padding:2px 6px;margin-left:8px;vertical-align:middle}
@media (max-width:900px){
  .nj{grid-template-columns:1fr}
  .nj-side{max-height:none;border-right:0;order:2}
  .nj-stagewrap{order:1}
  .pw-map .stage{position:relative;height:auto;min-height:0}
  .nj-mtitle{display:block!important}
  .nj-side>.nj-title{display:none}
}
.nj-mtitle{display:none;padding:18px 16px 0}
.pw-map .main,.pw-map .main.has-panel{display:block!important;grid-template-columns:none!important}

@media (max-width:720px){.hn.branch .dt{display:none}.hn.branch b{font-size:12px}.hn.branch .ty{font-size:8.5px;letter-spacing:.1em}.hn.hub .mono{top:16%}.hn.hub .band b{font-size:12px}#pwUp{top:auto;bottom:14px;left:14px}}
</style>
